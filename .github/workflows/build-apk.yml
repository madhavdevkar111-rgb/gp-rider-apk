name: Build GP Rider APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Capacitor & Permissions
        run: |
          mkdir -p www && echo "<h1>Loading GP Rider...</h1>" > www/index.html
          npm install
          npx cap add android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a \
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
          <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\
          <uses-permission android:name="android.permission.CAMERA" />\
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
          <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GP-Rider-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
        
